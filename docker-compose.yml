services:
  postgres:
    image: postgres:17-alpine
    container_name: collab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collab -d collab']
      interval: 5s
      timeout: 5s
      retries: 10

  # Not used yet. It is here so the pub/sub fan-out between multiple server
  # instances (and the Hocuspocus Redis extension) is a config change, not a
  # new piece of infrastructure, when we scale past one process.
  redis:
    image: redis:7-alpine
    container_name: collab-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
